# Add inside the existing HTTPS VirtualHost; enable proxy and proxy_http modules.
# .env: PUBLIC_ORIGIN=https://your-domain.example  BASE_PATH=/pmcanvas
ProxyPreserveHost On
RedirectMatch 308 ^/pmcanvas$ /pmcanvas/
ProxyPass "/pmcanvas/" "http://127.0.0.1:3000/pmcanvas/" connectiontimeout=5 timeout=60
ProxyPassReverse "/pmcanvas/" "http://127.0.0.1:3000/pmcanvas/"
