services:
  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: pmcanvas
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?Set DB_ADMIN_PASSWORD in .env}
      PM_DB_USER: pmcanvas
      PM_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./deploy/db-init.sh:/docker-entrypoint-initdb.d/10-pmcanvas.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pmcanvas"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    restart: unless-stopped
    init: true
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      BASE_PATH: ${BASE_PATH:-/pmcanvas}
      MFA_KEY_FILE: ${MFA_KEY_FILE:-/app/config/secrets/mfa.key}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-approval}
      REGISTRATION_DOMAINS: ${REGISTRATION_DOMAINS:-}
      MAIL_CONFIG_FILE: ${MAIL_CONFIG_FILE:-}
      AUTH_CONFIG_FILE: ${AUTH_CONFIG_FILE:-}
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS:-}
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${APP_DATABASE:-pmcanvas}
      PGUSER: pmcanvas
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      PGSSLMODE: disable
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_NAME: ${ADMIN_NAME:-관리자}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 64
    tmpfs: [/tmp]
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./backups:/backups
      - ./config/secrets/mfa.key:/run/secrets/mfa.key:ro
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${APP_DATABASE:-pmcanvas}
      PGUSER: postgres
      PGPASSWORD: ${DB_ADMIN_PASSWORD:?Set DB_ADMIN_PASSWORD}
      PGSSLMODE: disable
      BACKUP_RESTORE_OWNER: pmcanvas
volumes:
  pgdata:
