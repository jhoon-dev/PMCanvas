name: Tests and dependency audit
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PM_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: google-chrome --version
      - run: npm run test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: pmcanvas
          POSTGRES_PASSWORD: ci-fixture-password
          POSTGRES_DB: pmcanvas_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pmcanvas -d pmcanvas_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: pmcanvas
      PGPASSWORD: ci-fixture-password
      PGDATABASE: pmcanvas_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: node --test --test-concurrency=2 test/*.test.mjs
      - run: npm run test:http
        env:
          RUN_HTTP_TESTS: '1'
      - run: npm run test:postgres
        env:
          RUN_POSTGRES_TESTS: '1'
      - run: npm audit --audit-level=moderate
      - run: npm run test:performance
      - name: Verify storage with a non-default Linux UID
        run: docker run --rm --user 0:0 --read-only --tmpfs /tmp -v "$PWD/scripts/runtime-storage.mjs:/workspace/scripts/runtime-storage.mjs:ro" -v "$PWD/test/support/linux-storage-check.mjs:/workspace/test/support/linux-storage-check.mjs:ro" node:24-bookworm-slim node /workspace/test/support/linux-storage-check.mjs
      - name: Build backup sidecar and verify an actual isolated restore
        run: |
          docker build -f Dockerfile.backup -t pmcanvas-backup:ci .
          node -e "require('node:fs').writeFileSync(process.env.RUNNER_TEMP+'/pmcanvas-backup-key',Buffer.alloc(32,7),{mode:0o644})"
          node --input-type=module -e "import {createPool} from './server/pg-pool.mjs';const p=await createPool();await p.query('UPDATE pm_backup_settings SET enabled=true,next_run_at=now(),verify_restore=true,requested=false,lease_until=NULL');await p.end();"
          docker run --rm --network host --read-only --tmpfs /tmp -v "$RUNNER_TEMP/pmcanvas-backup-key:/run/secrets/mfa.key:ro" -e PGHOST -e PGUSER -e PGPASSWORD -e PGDATABASE -e BACKUP_DIR=/tmp/backups -e BACKUP_RESTORE_OWNER=pmcanvas pmcanvas-backup:ci node server/backup-worker.mjs --once
          node scripts/check-backup.mjs
