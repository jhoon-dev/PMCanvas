name: Tests and dependency audit
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: pmcanvas
          POSTGRES_PASSWORD: ci-fixture-password
          POSTGRES_DB: pmcanvas_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pmcanvas -d pmcanvas_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: pmcanvas
      PGPASSWORD: ci-fixture-password
      PGDATABASE: pmcanvas_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test --test-concurrency=2 test/*.test.mjs
      - run: npm run test:http
        env:
          RUN_HTTP_TESTS: '1'
      - run: npm run test:postgres
        env:
          RUN_POSTGRES_TESTS: '1'
      - run: npm audit --audit-level=moderate
