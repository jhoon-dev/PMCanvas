name: Windows Store MSIX
on:
  push:
    paths: ['desktop/**', 'shared/**', 'web/package*.json', '.github/workflows/desktop-store.yml']
  pull_request:
  workflow_dispatch:
    inputs:
      submission:
        description: Build a Partner Center submission with the configured Store identity
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify-msix:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm ci
        working-directory: desktop
      - run: node scripts/store.mjs --ci-test
        working-directory: desktop
      - run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File test/store-lifecycle.ps1
        working-directory: desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: MSIX-CI-test-results-not-for-publication
          path: desktop/test-results/
          retention-days: 7
  submission:
    if: github.event_name == 'workflow_dispatch' && inputs.submission
    needs: verify-msix
    environment: desktop-store
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm ci
        working-directory: desktop
      - run: npm run dist:win
        working-directory: desktop
        env:
          PM_STORE_IDENTITY_NAME: ${{ vars.PM_STORE_IDENTITY_NAME }}
          PM_STORE_PUBLISHER: ${{ vars.PM_STORE_PUBLISHER }}
          PM_STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.PM_STORE_PUBLISHER_DISPLAY_NAME }}
          PM_STORE_PRODUCT_ID: ${{ vars.PM_STORE_PRODUCT_ID }}
          PM_STORE_DISPLAY_NAME: ${{ vars.PM_STORE_DISPLAY_NAME }}
          PM_STORE_BUILD_NUMBER: ${{ github.run_number }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PMCanvas-Windows-Store-submission
          path: |
            desktop/dist/store-*/*-Store.msix
            desktop/dist/store-*/*-Store.msix.sha256
            desktop/dist/store-*/store-manifest.json
          if-no-files-found: error
          retention-days: 14
