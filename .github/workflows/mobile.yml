name: Mobile verification and development builds
on:
  push:
    branches: [main]
    paths:
      [
        'mobile/**',
        'shared/**',
        'vendor/picomatch/**',
        'scripts/test-picomatch.mjs',
        'package.json',
        '.prettier*',
        '.github/workflows/mobile.yml',
      ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: mobile
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: node ../scripts/test-picomatch.mjs mobile
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run verify:icons
      - run: npm run test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mobile-browser-results
          path: mobile/test-results/
          retention-days: 7
  android:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        id: java
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            mobile/android/**/*.gradle*
            mobile/android/**/gradle-wrapper.properties
            mobile/package-lock.json
            .github/workflows/mobile.yml
      - name: Restore compatible Gradle dependencies after a cache miss
        if: steps.java.outputs.cache-hit != 'true' && steps.java.outputs.cache-primary-key != ''
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          # Match setup-java's absolute path so existing cache archives are compatible.
          path: /home/runner/.gradle/caches
          key: ${{ steps.java.outputs.cache-primary-key }}
          restore-keys: setup-java-Linux-x64-gradle-
      - run: npm ci --ignore-scripts
      - run: chmod +x android/gradlew
      - name: Build Android and back off only on Maven rate limiting
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            log="$RUNNER_TEMP/pmcanvas-android-$attempt.log"
            set +e
            npm run android:apk 2>&1 | tee "$log"
            build_status=${PIPESTATUS[0]}
            set -e
            if (( build_status == 0 )); then exit 0; fi
            if ! grep -q 'Received status code 429 from server: Too Many Requests' "$log" || (( attempt == 3 )); then
              exit "$build_status"
            fi
            delay=$((attempt * 60))
            echo "::warning::Maven dependency downloads were throttled; retrying in $delay seconds (attempt $attempt/3)."
            sleep "$delay"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PMCanvas-Android-development
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
  ios:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run sync
      - run: xcodebuild -version
      - run: npm run test:ios
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PMCanvas-iPhone-verification-NOT-for-submission
          path: |
            mobile/build/PMCanvas-iPhone-*.zip
            mobile/build/ios-verification.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: PMCanvas-iPhone-failure-results
          path: mobile/build/iPhoneTests.xcresult
          retention-days: 7
