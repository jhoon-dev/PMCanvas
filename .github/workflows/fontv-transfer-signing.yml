name: Transfer Font V signing
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  encrypted-transfer:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: desktop-mac-store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Encrypt existing signing configuration for Font V
        run: node .github/ci/fontv-export-signing.mjs
        env:
          FONTV_SOURCE_KEY: ${{ secrets.FONTV_SOURCE_KEY }}
          MAS_CSC_LINK: ${{ secrets.MAS_CSC_LINK }}
          MAS_CSC_KEY_PASSWORD: ${{ secrets.MAS_CSC_KEY_PASSWORD }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FontV-encrypted-signing-transfer
          path: fontv-transfer/signing.enc.json
          retention-days: 1
          if-no-files-found: error
