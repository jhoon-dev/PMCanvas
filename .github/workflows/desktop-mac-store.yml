name: Mac App Store
on:
  push:
    paths:
      ['desktop/**', 'shared/**', 'web/package*.json', '.github/workflows/desktop-mac-store.yml']
  pull_request:
  workflow_dispatch:
    inputs:
      submission:
        description: Build a signed App Store PKG using desktop-mac-store credentials
        type: boolean
        default: false
      upload:
        description: Validate and upload the signed PKG to App Store Connect (does not submit App Review)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npm run verify:mas
        working-directory: desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PMCanvas-MAS-verification-NOT-for-submission
          path: |
            desktop/dist/mas-verify-*/*.zip
            desktop/dist/mas-verify-*/mas-manifest.json
          if-no-files-found: error
          retention-days: 7
  submission:
    if: github.event_name == 'workflow_dispatch' && inputs.submission && github.ref == 'refs/heads/main'
    needs: verify
    environment: desktop-mac-store
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      PM_MAS_TEAM_ID: ${{ vars.PM_MAS_TEAM_ID }}
      PM_MAS_BUILD_NUMBER: ${{ github.run_number }}
      CSC_LINK: ${{ secrets.MAS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAS_CSC_KEY_PASSWORD }}
      CSC_INSTALLER_LINK: ${{ secrets.MAS_INSTALLER_CSC_LINK }}
      CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.MAS_INSTALLER_CSC_KEY_PASSWORD }}
      PM_MAS_PROFILE_BASE64: ${{ secrets.MAS_PROVISION_PROFILE_BASE64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Prepare provisioning profile
        env:
          PM_MAS_PROFILE: ${{ runner.temp }}/pmcanvas-mas.provisionprofile
        run: |
          node --input-type=module -e '
          import fs from "node:fs";
          if (!process.env.PM_MAS_PROFILE_BASE64) throw Error("Configure MAS_PROVISION_PROFILE_BASE64 in desktop-mac-store.");
          fs.writeFileSync(process.env.PM_MAS_PROFILE, Buffer.from(process.env.PM_MAS_PROFILE_BASE64, "base64"), { mode: 0o600 });
          fs.appendFileSync(process.env.GITHUB_ENV, "PM_MAS_PROFILE=" + process.env.PM_MAS_PROFILE + "\n");'
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm ci
        working-directory: desktop
      - run: npm run dist:mas
        working-directory: desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PMCanvas-Mac-App-Store-submission
          path: |
            desktop/dist/mas-submission-*/mas-universal/*.pkg
            desktop/dist/mas-submission-*/mas-universal/*.sha256
            desktop/dist/mas-submission-*/mas-manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Validate and upload to App Store Connect
        if: inputs.upload
        run: node desktop/scripts/upload-mac-store.mjs
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      - name: Remove provisioning profile
        if: always()
        run: rm -f -- "$RUNNER_TEMP/pmcanvas-mas.provisionprofile"
