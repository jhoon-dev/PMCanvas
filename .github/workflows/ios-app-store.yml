name: iOS App Store
on:
  pull_request:
    paths: ['mobile/**', 'shared/**', '.github/workflows/ios-app-store.yml']
  workflow_dispatch:
    inputs:
      upload:
        description: Sign and upload an iOS App Store IPA from main (does not submit App Review)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ios-store-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  screenshots:
    runs-on: macos-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        device: [iphone, ipad]
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: npm run build && npx cap sync ios
      - run: node scripts/ios-store-screenshots.mjs ${{ matrix.device }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: PMCanvas-iOS-Store-screenshots-${{ matrix.device }}
          path: mobile/build/store-screenshots-${{ matrix.device }}/
          if-no-files-found: error
          retention-days: 14
  submission:
    if: github.event_name == 'workflow_dispatch' && inputs.upload && github.ref == 'refs/heads/main'
    needs: screenshots
    runs-on: macos-latest
    timeout-minutes: 35
    environment: desktop-mac-store
    defaults:
      run:
        working-directory: mobile
    env:
      PM_IOS_TEAM_ID: ${{ vars.PM_MAS_TEAM_ID }}
      PM_IOS_BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Archive, sign and verify iOS IPA
        run: node scripts/build-ios-store.mjs
        env:
          PM_IOS_CSC_LINK: ${{ secrets.MAS_CSC_LINK }}
          PM_IOS_CSC_PASSWORD: ${{ secrets.MAS_CSC_KEY_PASSWORD }}
          PM_IOS_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
      - name: Validate and upload to App Store Connect
        run: node scripts/upload-ios-store.mjs
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: PMCanvas-iOS-App-Store-submission
          path: |
            mobile/build/app-store/*.ipa
            mobile/build/app-store/*manifest.json
            mobile/build/app-store/upload-result.json
          if-no-files-found: error
          retention-days: 14
