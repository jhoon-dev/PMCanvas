name: Desktop verification and builds
on:
  push:
    paths:
      [
        'desktop/**',
        'shared/**',
        'web/package*.json',
        'package.json',
        '.prettier*',
        '.github/workflows/desktop.yml',
      ]
  pull_request:
    paths:
      [
        'desktop/**',
        'shared/**',
        'web/package*.json',
        'package.json',
        '.prettier*',
        '.github/workflows/desktop.yml',
      ]
  workflow_dispatch:
    inputs:
      signed:
        description: Build signed releases using the desktop-release environment
        type: boolean
        default: false
      unsigned:
        description: Build unsigned installers for Windows and macOS
        type: boolean
        default: false
      publish:
        description: Publish unsigned installers only after all installation checks pass
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm ci
        working-directory: desktop
      - run: npm run format:check
      - run: npm run public:check
      - run: npm audit --audit-level=moderate
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npx playwright install chromium --only-shell
        working-directory: web
      - run: npm run test:renderer
        working-directory: desktop
      - run: npm run test:dates-language
        working-directory: desktop
      - run: npm run test:app
        working-directory: desktop
      - run: npm run pack
        if: runner.os == 'Windows'
        working-directory: desktop
      - run: npm run pack -- --config.mac.identity=- --config.mac.hardenedRuntime=false
        if: runner.os == 'macOS'
        working-directory: desktop
      - run: node scripts/check-package.mjs --smoke
        working-directory: desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: desktop-test-results-${{ runner.os }}
          path: desktop/test-results/
          retention-days: 7
  unsigned:
    if: github.event_name == 'workflow_dispatch' && inputs.unsigned
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm ci
        working-directory: desktop
      - run: npm run dist:unsigned:${{ matrix.target }}
        working-directory: desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PMCanvas-unsigned-${{ matrix.target }}
          path: |
            desktop/dist/unsigned-*/*.exe
            desktop/dist/unsigned-*/*.dmg
            desktop/dist/unsigned-*/*.zip
            desktop/dist/unsigned-*/*.sha256
            desktop/dist/unsigned-*/unsigned-manifest.json
          if-no-files-found: error
          retention-days: 14
  install:
    if: github.event_name == 'workflow_dispatch' && inputs.unsigned
    needs: unsigned
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm ci
        working-directory: desktop
      - run: npm run prepare:app
        working-directory: desktop
      - run: node scripts/download-ci-installers.mjs
        working-directory: desktop
        env:
          GH_TOKEN: ${{ github.token }}
      - run: node test/install-lifecycle.mjs
        working-directory: desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: install-lifecycle-${{ matrix.os }}
          path: desktop/test-results/install-lifecycle-*.json
          if-no-files-found: warn
          retention-days: 14
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.unsigned && inputs.publish
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: node desktop/scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
  signed:
    if: github.event_name == 'workflow_dispatch' && inputs.signed
    needs: verify
    environment: desktop-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            certificate: WIN_CSC_LINK
            password: WIN_CSC_KEY_PASSWORD
          - os: macos-latest
            target: mac
            certificate: MAC_CSC_LINK
            password: MAC_CSC_KEY_PASSWORD
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm ci
        working-directory: desktop
      - run: node scripts/ci-signing.mjs
        working-directory: desktop
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      - run: npm run dist:${{ matrix.target }}
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets[matrix.certificate] }}
          CSC_KEY_PASSWORD: ${{ secrets[matrix.password] }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PMCanvas-signed-${{ matrix.target }}
          path: |
            desktop/dist/release-*/*.exe
            desktop/dist/release-*/*.dmg
            desktop/dist/release-*/*.zip
            desktop/dist/release-*/*.sha256
            desktop/dist/release-*/release-manifest.json
          if-no-files-found: error
          retention-days: 14
