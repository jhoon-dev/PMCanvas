name: Desktop verification and builds
on:
  push:
    paths:
      [
        'desktop/**',
        'shared/**',
        'web/package*.json',
        'package.json',
        '.prettier*',
        '.github/workflows/desktop.yml',
      ]
  # Required branch checks must run for every PR, including web-only/doc changes.
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to build, install-test and publish
        type: choice
        options: [all, mac, win]
        default: mac
      signed:
        description: Sign Mac releases using desktop-release (Windows uses the Store workflow)
        type: boolean
        default: false
      unsigned:
        description: Build unsigned installers for the selected platforms
        type: boolean
        default: false
      publish:
        description: Publish selected signed or unsigned installers after verification
        type: boolean
        default: false
      release_run:
        description: Optional verified build run ID to retry publication without rebuilding
        type: string
        default: ''
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      builds: ${{ steps.plan.outputs.builds }}
      installs: ${{ steps.plan.outputs.installs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - id: plan
        run: node desktop/scripts/ci-release-plan.mjs
        env:
          PM_SIGNED: ${{ inputs.signed }}
          PM_UNSIGNED: ${{ inputs.unsigned }}
          PM_PUBLISH: ${{ inputs.publish }}
          PM_RELEASE_RUN_ID: ${{ inputs.release_run }}
          PM_RELEASE_PLATFORM: ${{ inputs.platform }}
  verify:
    if: github.event_name != 'workflow_dispatch' || inputs.release_run == ''
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm ci
        working-directory: desktop
      - run: npm run format:check
      - run: npm run public:check
      - run: npm audit --audit-level=moderate
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npx playwright install chromium --only-shell
        working-directory: web
      - run: npm run test:renderer
        working-directory: desktop
      - run: npm run test:dates-language
        working-directory: desktop
      - run: npm run test:app
        working-directory: desktop
      - run: node scripts/store-screenshots.mjs
        if: runner.os == 'macOS'
        working-directory: desktop
      - run: npm run pack
        if: runner.os == 'Windows'
        working-directory: desktop
      - run: npm run pack -- --config.mac.identity=- --config.mac.hardenedRuntime=false
        if: runner.os == 'macOS'
        working-directory: desktop
      - run: node scripts/check-package.mjs --smoke
        working-directory: desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: desktop-test-results-${{ runner.os }}
          path: desktop/test-results/
          retention-days: 7
  mac-p12-interop:
    name: Windows P12 import on macOS
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Download synthetic Windows credential fixture from this run
        run: gh run download "$GITHUB_RUN_ID" --repo github.com/jhoon-dev/PMCanvas --name desktop-test-results-Windows --dir "$PM_SIGNING_INTEROP_FOLDER"
        env:
          GH_TOKEN: ${{ github.token }}
          PM_SIGNING_INTEROP_FOLDER: ${{ runner.temp }}/pmcanvas-signing-interop
      - name: Import and export Windows P12 in a disposable keychain
        run: node --test --test-name-pattern='CI macOS imports' desktop/test/mac-signing.test.mjs
        env:
          PM_SIGNING_INTEROP_FOLDER: ${{ runner.temp }}/pmcanvas-signing-interop
  unsigned:
    name: unsigned (${{ matrix.os }}, ${{ matrix.target }})
    if: github.event_name == 'workflow_dispatch' && inputs.unsigned && inputs.release_run == ''
    needs: [plan, verify, mac-p12-interop]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.builds) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm ci
        working-directory: desktop
      - run: npm run dist:unsigned:${{ matrix.target }}
        working-directory: desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PMCanvas-unsigned-${{ matrix.target }}
          path: |
            desktop/dist/unsigned-*/*.exe
            desktop/dist/unsigned-*/*.dmg
            desktop/dist/unsigned-*/*.zip
            desktop/dist/unsigned-*/*.sha256
            desktop/dist/unsigned-*/unsigned-manifest.json
          if-no-files-found: error
          retention-days: 14
  install:
    name: install (${{ matrix.os }})
    if: always() && needs.plan.result == 'success' && (needs.unsigned.result == 'success' || needs.signed.result == 'success')
    needs: [plan, unsigned, signed]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.installs) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PM_INSTALLER_MODE: ${{ needs.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm ci
        working-directory: desktop
      - run: npm run prepare:app
        working-directory: desktop
      - run: node scripts/download-ci-installers.mjs
        working-directory: desktop
        env:
          GH_TOKEN: ${{ github.token }}
      - run: node test/install-lifecycle.mjs
        working-directory: desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: install-lifecycle-${{ matrix.os }}
          path: desktop/test-results/install-lifecycle-*.json
          if-no-files-found: warn
          retention-days: 14
  release:
    if: always() && github.event_name == 'workflow_dispatch' && inputs.publish && needs.plan.result == 'success' && (needs.install.result == 'success' || inputs.release_run != '')
    needs: [plan, install]
    environment: desktop-update-signing
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    concurrency:
      group: desktop-release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: node desktop/scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          PM_RELEASE_RUN_ID: ${{ inputs.release_run }}
          PM_RELEASE_MODE: ${{ needs.plan.outputs.mode }}
          PM_RELEASE_PLATFORM: ${{ inputs.platform }}
          PM_UPDATE_SIGNING_KEY: ${{ secrets.PM_UPDATE_SIGNING_KEY }}
  signed:
    name: signed (${{ matrix.os }}, ${{ matrix.target }})
    if: github.event_name == 'workflow_dispatch' && inputs.signed && inputs.release_run == ''
    needs: [plan, verify, mac-p12-interop]
    environment: desktop-release
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.builds) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm ci
        working-directory: desktop
      - run: node scripts/ci-signing.mjs
        working-directory: desktop
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      - run: npm run dist:${{ matrix.target }}
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets[matrix.target == 'win' && 'WIN_CSC_LINK' || 'MAC_CSC_LINK'] }}
          CSC_KEY_PASSWORD: ${{ secrets[matrix.target == 'win' && 'WIN_CSC_KEY_PASSWORD' || 'MAC_CSC_KEY_PASSWORD'] }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Remove temporary notarization key
        if: always() && runner.os == 'macOS'
        run: node scripts/ci-signing.mjs --cleanup
        working-directory: desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PMCanvas-signed-${{ matrix.target }}
          path: |
            desktop/dist/release-*/*.exe
            desktop/dist/release-*/*.dmg
            desktop/dist/release-*/*.zip
            desktop/dist/release-*/*.sha256
            desktop/dist/release-*/release-manifest.json
          if-no-files-found: error
          retention-days: 14
