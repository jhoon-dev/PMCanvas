# Standalone alternative; use: docker compose -f compose.external.yml up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    init: true
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - ./certs:/app/certs:ro
      - ./config:/app/config:ro
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}
      BASE_PATH: ${BASE_PATH:-/pmcanvas}
      MFA_KEY_FILE: ${MFA_KEY_FILE:-/app/config/secrets/mfa.key}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-approval}
      REGISTRATION_DOMAINS: ${REGISTRATION_DOMAINS:-}
      MAIL_CONFIG_FILE: ${MAIL_CONFIG_FILE:-}
      AUTH_CONFIG_FILE: ${AUTH_CONFIG_FILE:-}
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS:-}
      PGHOST: ${PGHOST:?Set PGHOST}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PGDATABASE:-pmcanvas}
      PGUSER: ${PGUSER:-pmcanvas}
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD}
      PGSSLMODE: ${PGSSLMODE:-verify-full}
      PGSSLROOTCERT: ${PGSSLROOTCERT:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL}
      ADMIN_NAME: ${ADMIN_NAME:-관리자}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
