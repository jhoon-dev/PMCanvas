<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#152b41" />
    <meta
      name="description"
      content="인력과 업무를 연결하고, 매일의 완료 기록으로 프로젝트의 다음을 확인하세요."
    />
    <title>PM Canvas · 프로젝트 한눈에</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%232965d9'/%3E%3Cpath d='M11 11h8v18h-8zm11 0h7v10h-7z' fill='white'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./wbs.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <section id="authGate" class="auth-gate">
      <form id="loginForm" class="auth-card">
        <label class="language-control"
          ><span>Language / 언어</span
          ><select class="language-select" aria-label="Language / 언어">
            <option value="ko">한국어</option>
            <option value="en">English</option>
          </select></label
        >
        <span class="eyebrow">PROJECT WORKSPACE</span>
        <h1>PM Canvas</h1>
        <p>팀의 오늘을 기록하고, 프로젝트의 내일을 확인하세요.</p>
        <label class="field"
          >이메일<input id="loginEmail" type="email" autocomplete="username" required /></label
        ><label class="field"
          >비밀번호<input
            id="loginPassword"
            type="password"
            autocomplete="current-password"
            required
            maxlength="256"
        /></label>
        <p id="authError" class="form-error" role="alert"></p>
        <button class="button primary">로그인</button
        ><button type="button" id="forgotPasswordButton" class="auth-link">
          비밀번호를 잊으셨나요?</button
        ><button type="button" id="registerButton" class="auth-link" hidden>
          처음이신가요? 회원가입</button
        ><small id="registrationDisabled">계정이 없으면 서버 관리자에게 요청하세요.</small>
      </form>
    </section>
    <aside class="sidebar">
      <a class="brand" href="#overview"
        ><span class="brand-mark"><i></i><i></i><i></i></span
        ><span>PM Canvas<small>PROJECT WORKSPACE</small></span></a
      >
      <div class="side-label">WORKSPACE</div>
      <nav aria-label="주 메뉴">
        <button data-view="overview" class="nav-item active">
          <span data-icon="dashboard"></span>프로젝트 한눈에</button
        ><button data-view="tasks" class="nav-item">
          <span data-icon="layers"></span>업무 · 일정<span
            id="taskNavCount"
            class="nav-count"
          ></span></button
        ><button data-view="daily" class="nav-item">
          <span data-icon="check"></span>내 업무<span class="small-dot"></span></button
        ><button data-view="people" class="nav-item">
          <span data-icon="users"></span>참여인력
        </button>
      </nav>
      <div class="side-line"></div>
      <div class="side-label">
        내 프로젝트
        <button id="newProjectSide" class="icon-button light" aria-label="프로젝트 추가">＋</button>
      </div>
      <div id="projectList" class="project-list"></div>
      <div class="side-bottom">
        <span class="local-indicator"></span>
        <div>서버에 저장<small>팀과 함께하는 프로젝트</small></div>
        <button id="helpButton" class="icon-button light" aria-label="사용 방법">?</button>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="breadcrumb">
          워크스페이스 <span>/</span> <strong id="breadcrumbProject"></strong>
        </div>
        <div class="mobile-projects">
          <select id="projectSelect" aria-label="프로젝트 선택"></select
          ><button id="mobileNewProject" class="icon-button" aria-label="새 프로젝트 만들기">
            ＋
          </button>
        </div>
        <div class="top-actions">
          <label class="language-control"
            ><span class="sr-only">Language / 언어</span
            ><select class="language-select" aria-label="Language / 언어">
              <option value="ko">한국어</option>
              <option value="en">English</option>
            </select></label
          >
          <span id="saveStatus" class="save-status">저장됨</span>
          <details class="action-menu top-file-menu">
            <summary class="button ghost small">파일</summary>
            <div class="menu-popover">
              <button id="backupButton" class="button ghost small">
                <span data-icon="download"></span>백업</button
              ><button
                id="importButton"
                class="button ghost small"
                aria-label="프로젝트 백업 불러오기"
              >
                <span data-icon="upload"></span>백업 불러오기
              </button>
              <button id="excelExport" class="button ghost small">Excel 내보내기</button>
              <button id="excelImport" class="button ghost small" data-action="import-excel">
                Excel 가져오기
              </button>
            </div>
          </details>
          <button id="accountButton" class="button ghost small">계정</button>
        </div>
      </header>
      <a class="skip-link" href="#main">본문으로 건너뛰기</a>
      <main id="main" tabindex="-1"></main>
      <footer>
        <span>작은 체크가 모여, 프로젝트의 다음이 보입니다.</span
        ><button id="methodFooter">진척률 · 예상일 계산 방법 ↗</button>
      </footer>
    </div>
    <dialog id="editorDialog" aria-labelledby="dialogTitle" aria-describedby="formError">
      <form id="editorForm">
        <div class="dialog-head">
          <div>
            <span class="eyebrow" id="dialogEyebrow">WORKSPACE</span>
            <h2 id="dialogTitle"></h2>
          </div>
          <button type="button" id="closeDialog" class="icon-button" aria-label="닫기">×</button>
        </div>
        <div id="dialogBody"></div>
        <p id="formError" class="form-error" role="alert"></p>
        <div class="dialog-actions">
          <button type="button" id="deleteButton" class="button danger ghost" hidden>삭제</button
          ><span class="spacer"></span
          ><button type="button" id="cancelDialog" class="button">취소</button
          ><button type="submit" class="button primary" id="submitButton">저장하기</button>
        </div>
      </form>
    </dialog>
    <dialog id="infoDialog" aria-labelledby="infoTitle">
      <div class="dialog-head">
        <div>
          <span class="eyebrow">HOW IT WORKS</span>
          <h2 id="infoTitle"></h2>
        </div>
        <button id="closeInfo" class="icon-button" aria-label="안내 닫기">×</button>
      </div>
      <div id="infoBody" class="info-body"></div>
    </dialog>
    <input type="file" id="importFile" accept="application/json,.json" hidden />
    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
