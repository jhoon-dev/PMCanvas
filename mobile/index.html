<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f6fa" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <title>PM Canvas</title>
    <link rel="icon" type="image/png" href="./assets/icon.png" />
    <script type="module" src="/src/app.js"></script>
  </head>
  <body class="mobile-app">
    <a class="skip-link" href="#content">본문으로 건너뛰기</a>
    <header class="app-header mobile-header">
      <button
        id="openWorkspaceMenu"
        type="button"
        class="icon-button"
        aria-label="프로젝트 메뉴 열기"
        aria-controls="workspaceDrawer"
        aria-expanded="false"
        hidden
      >
        ☰
      </button>
      <a class="workspace-brand" href="#projects" aria-label="프로젝트 목록">
        <img src="./assets/icon.png" width="30" height="30" alt="" />
        <span><strong>PM Canvas</strong><small id="activeProjectName">프로젝트 관리</small></span>
      </a>
      <details id="workspaceFiles" class="action-menu workspace-files" hidden>
        <summary class="icon-button" aria-label="프로젝트 파일과 설정">⋯</summary>
        <div class="menu-popover"></div>
      </details>
    </header>
    <main id="content" tabindex="-1">
      <p class="loading" role="status">프로젝트를 불러오고 있습니다…</p>
    </main>
    <nav id="navigation" class="bottom-nav" aria-label="주 메뉴" hidden></nav>
    <dialog id="workspaceDrawer" aria-labelledby="workspaceMenuTitle">
      <header class="drawer-head">
        <div>
          <h2 id="workspaceMenuTitle">프로젝트 메뉴</h2>
          <p id="drawerProjectName"></p>
        </div>
        <button
          id="closeWorkspaceMenu"
          type="button"
          class="icon-button"
          aria-label="프로젝트 메뉴 닫기"
        >
          ×
        </button>
      </header>
      <nav id="workspaceNavigation" aria-label="현재 프로젝트 메뉴"></nav>
      <a class="drawer-projects" href="#projects">← 프로젝트 목록</a>
    </dialog>
    <dialog id="editor" aria-labelledby="editorTitle">
      <form id="editorForm">
        <div class="dialog-head">
          <h2 id="editorTitle"></h2>
          <button type="button" id="closeEditor" class="icon-button" aria-label="입력 취소">
            ×
          </button>
        </div>
        <div id="editorBody"></div>
        <p id="formError" class="error" role="alert"></p>
        <div class="dialog-actions">
          <button type="button" id="deleteItem" class="button danger" hidden>삭제</button
          ><span></span><button type="button" id="cancelEditor" class="button">취소</button
          ><button id="submitEditor" class="button primary">저장</button>
        </div>
      </form>
    </dialog>
    <dialog id="privacyDialog" aria-labelledby="privacyTitle">
      <div class="dialog-head">
        <h2 id="privacyTitle">개인정보처리방침</h2>
        <button
          type="button"
          id="closePrivacy"
          class="icon-button"
          aria-label="개인정보처리방침 닫기"
        >
          ×
        </button>
      </div>
      <div id="privacyBody" class="privacy-content"></div>
    </dialog>
    <dialog id="confirmation" aria-labelledby="confirmTitle">
      <form method="dialog">
        <h2 id="confirmTitle">삭제할까요?</h2>
        <p id="confirmText"></p>
        <div class="dialog-actions">
          <button class="button" value="cancel" autofocus>취소</button
          ><button id="confirmAccept" class="button danger" value="delete">삭제</button>
        </div>
      </form>
    </dialog>
    <input
      id="importFile"
      type="file"
      accept=".pmcanvas,.json,application/json,application/octet-stream"
      hidden
    />
    <div id="toast" role="status" hidden>
      <span id="toastText"></span
      ><button id="toastUndo" class="toast-undo" data-action="undo" hidden>되돌리기</button>
    </div>
  </body>
</html>
